# The lighttpd rule of the battery addon: /addons/battery/ is served by the addon's own server on the loopback.
# On openccu-lite the system makes its own validated copy of this file; on a CCU update_script copies it to
# /usr/local/etc/config/lighttpd/battery.conf.

$HTTP["url"] == "/addons/battery" {
    url.redirect = ("^/addons/battery$" => "/addons/battery/")
}

$HTTP["url"] =~ "^/addons/battery/" {
    proxy.server = ("" => (("host" => "127.0.0.1", "port" => 8291)))
    server.errorfile-prefix = "/usr/local/addons/battery/www/lighttpd-error-"
}
