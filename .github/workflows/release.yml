# A release: a tag v<version> on main. The checks run again for the tag, the packages are built
# with the tag's version, and the release is made with the gh CLI - its title is the tag, its
# assets the packages and their SHA-256 files (battery-<arch>-<version>.tar.gz and .sha256, the
# names openccu-lite's catalogue resolves), marked Latest. Its notes are release-notes/<version>.md
# when the tagged commit has that file, otherwise the changelog's section of the version.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: The tag is the manifest's version and has its changelog entry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version addon/openccu-lite.json)" = "$VERSION" || { echo "the manifest's version is not $VERSION"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: scripts/build.sh
      - name: Every package carries the version
        run: |
          for arch in aarch64 x86_64 armv7l; do
            pkg=dist/battery-$arch-$VERSION.tar.gz
            (cd dist && sha256sum -c "$(basename "$pkg").sha256")
            test "$(tar -xzOf "$pkg" ./openccu-lite.json | jq -r .version)" = "$VERSION"
            test "$(tar -xzOf "$pkg" ./battery/versions)" = "VERSION_ADDON=$VERSION"
            test "$(tar -xzOf "$pkg" ./ARCH)" = "$arch"
          done
      - name: The release notes
        run: |
          if [ -f "release-notes/$VERSION.md" ]; then
            cp "release-notes/$VERSION.md" notes.md
          else
            awk -v v="$VERSION" '$0 ~ "^## \\[" { on = ($0 ~ "^## \\[" v "\\]"); next } on' CHANGELOG.md > notes.md
          fi
          test -s notes.md
          cat notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag --latest
